<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversor Universal</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Librerías externas -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.0.0/docx.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
  <header class="hero">
    <h1>⚡ Conversor <span class="gradient">Universal</span></h1>
    <p>Convierte <strong>Markdown</strong> y <strong>HTML</strong> a múltiples formatos — con estilo galáctico.</p>
  </header>

  <main class="main-grid">
    <section class="editor glass">
      <label for="input">✍️ Tu contenido (MD/HTML)</label>
      <textarea id="input" placeholder="# Hola universo 🌌\n**Negrita**, _cursiva_, `código`…"></textarea>
      <input type="file" id="fileInput" />
    </section>

    <section class="preview glass">
      <h3>👀 Vista Previa</h3>
      <div id="preview"></div>
    </section>
  </main>

  <div class="actions">
    <button class="btn btn-primary" onclick="exportPDF()">Exportar a PDF</button>
    <button class="btn btn-primary" onclick="exportDOCX()">Exportar a DOCX</button>
    <button class="btn btn-primary" onclick="exportPNG()">Exportar a PNG</button>
    <button class="btn btn-primary" onclick="exportTXT()">Exportar a TXT</button>
    <button class="btn btn-primary" onclick="exportMD()">Exportar a MD</button>
    <button class="btn btn-ghost" onclick="clearText()">Limpiar</button>
  </div>

  <footer class="foot">Hecho con 💫 por Joh4nn6</footer>

<script>
const input = document.getElementById('input');
const preview = document.getElementById('preview');

// Render en tiempo real
input.addEventListener('input', () => {
  preview.innerHTML = marked.parse(input.value);
});

// Cargar archivo
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = ev => { input.value = ev.target.result; input.dispatchEvent(new Event('input')); };
    reader.readAsText(file);
  }
});

// Limpiar
function clearText(){ input.value = ''; preview.innerHTML = ''; }

// Exportar PDF
function exportPDF(){
  const { jsPDF } = window.jspdf;
  html2canvas(preview).then(canvas => {
    const imgData = canvas.toDataURL('image/png');
    const pdf = new jsPDF();
    pdf.addImage(imgData, 'PNG', 10, 10, 190, 0);
    pdf.save("output.pdf");
  });
}

// Exportar DOCX
function exportDOCX(){
  const { Document, Packer, Paragraph } = window.docx;
  const paragraphs = input.value.split("\n").map(line => new Paragraph(line));
  const doc = new Document({ sections: [{ properties: {}, children: paragraphs }] });
  Packer.toBlob(doc).then(blob => { saveAs(blob, "output.docx"); });
}

// Exportar PNG
function exportPNG(){
  html2canvas(preview).then(canvas => {
    canvas.toBlob(blob => saveAs(blob, "output.png"));
  });
}

// Exportar TXT
function exportTXT(){
  const blob = new Blob([input.value], { type: "text/plain;charset=utf-8" });
  saveAs(blob, "output.txt");
}

// Exportar MD
function exportMD(){
  const blob = new Blob([input.value], { type: "text/markdown;charset=utf-8" });
  saveAs(blob, "output.md");
}
</script>
</body>
</html>
